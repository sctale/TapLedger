services:
  tapledger:
    # 镜像由 GitHub Actions 自动构建并推送（server/** 变更即触发，推 latest + 版本号）
    image: ghcr.io/sctale/tapledger-server:latest
    container_name: tapledger-server
    restart: unless-stopped
    ports:
      - "8420:8420"
    environment:
      - PORT=8420
      - TZ=Asia/Shanghai
      # JWT_SECRET 从同级 .env 读取（不提交到公开仓库；首次部署前在 server/.env 里设置）
    env_file:
      - .env
    volumes:
      # 数据库持久化（备份这个目录即可）
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8420/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
